name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: monthly-workbook-macos
            path: dist/月度生产表生成器.app
          - os: windows-2025
            artifact: monthly-workbook-windows
            path: dist/月度生产表生成器.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - if: runner.os == 'macOS'
        run: sh scripts/build_macos.sh
      - if: runner.os == 'Windows'
        run: scripts\build_windows.bat
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\月度生产表生成器.exe' -DestinationPath 'dist\月度生产表生成器-Windows.zip'
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/月度生产表生成器.app' 'dist/月度生产表生成器-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            dist/月度生产表生成器-Windows.zip
            dist/月度生产表生成器-macOS.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-files -type f -name '*.exe' -exec cp {} release-assets/ \;
          find release-files -type f -name '*.zip' -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
